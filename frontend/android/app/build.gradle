apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.visioniq"
    defaultConfig {
        applicationId "com.visioniq"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
    // Required for LiteRT / MediaPipe large native libs
    packagingOptions {
        pickFirst 'lib/x86/libc++_shared.so'
        pickFirst 'lib/x86_64/libc++_shared.so'
        pickFirst 'lib/armeabi-v7a/libc++_shared.so'
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
    }
}

dependencies {
    // React Native core
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // ── LiteRT-LM on-device inference ───────────────────────────────────
    // Runs the gemma-4-E2B-it.litertlm bundle. This replaces
    // com.google.mediapipe:tasks-genai, which cannot do vision on Gemma 4:
    // its vision executor requires an encoder with exactly one input tensor
    // (litert_vision_executor.cc:294) and Gemma 4's has several. LiteRT-LM is
    // also the runtime Google's AI Edge Gallery ships for these models, and the
    // MediaPipe LLM API is in maintenance-only mode.
    // Hosted on Google Maven only — not Maven Central.
    implementation 'com.google.ai.edge.litertlm:litertlm-android:0.16.1'
}
